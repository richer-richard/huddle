# cargo-deny configuration for huddle (2.0.0+).
#
# Run `cargo deny check` to audit the dependency tree for security advisories,
# disallowed/unknown licenses, banned crates, and untrusted sources. huddle
# pulls a heavy tree (libp2p, vodozemac, the RustCrypto post-quantum crates,
# rustls/ring, vendored OpenSSL via SQLCipher), so a standing supply-chain gate
# is worthwhile. Install once with `cargo install cargo-deny`.

[graph]
# Check the platforms huddle actually ships on.
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-apple-darwin" },
    { triple = "x86_64-apple-darwin" },
    { triple = "x86_64-pc-windows-msvc" },
]
all-features = false

[advisories]
# RustSec advisory database. Deny anything with a live advisory or a yanked
# release; unmaintained/unsound default to warn so they surface without
# breaking the build on a transitive dep we can't immediately replace.
version = 2
yanked = "deny"
# Only fail on unmaintained crates a workspace member depends on DIRECTLY. The
# unmaintained advisories in our tree (paste/proc-macro-error2 via libp2p &
# vodozemac, bincode) are deep transitive deps we can't replace; they still
# surface in `cargo audit` but don't break this gate.
unmaintained = "workspace"
# Transitive advisories reviewed and accepted (see .cargo/audit.toml for the same
# list with full rationale). Each is unfixable upstream now; revisit on dep bumps.
# A NEW advisory still fails the gate. (rsa's RUSTSEC-2023-0071 lives only in
# .cargo/audit.toml — cargo-deny uses default features, so it never resolves the
# optional, default-OFF Arti path that pulls rsa.)
ignore = [
    "RUSTSEC-2026-0118", # hickory-proto NSEC3 DoS — no upstream fix; via libp2p-mdns (LAN, opt-in)
    "RUSTSEC-2026-0119", # hickory-proto O(n^2) DoS — fixed in 0.26.1 but pinned by libp2p-mdns 0.48
]

[licenses]
version = 2
# huddle is MIT OR Apache-2.0; only accept permissive / weak-copyleft licenses
# compatible with redistribution. Add to this list (with justification) if a new
# dependency legitimately needs another permissive license.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
    "OpenSSL",
    "BSL-1.0",
    # Permissive font licenses for the default fonts bundled by epaint/egui
    # (huddle-gui). Standard open-font licenses, fine to redistribute.
    "OFL-1.1",
    "Ubuntu-font-1.0",
    # Mozilla's CA root certificate data shipped by webpki-roots (via ureq's
    # TLS). A permissive data license.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8
# NOTE: `ring` carries a non-SPDX license file that cargo-deny will ask you to
# clarify on the first run; add a `[[licenses.clarify]]` for it (with the real
# license-file hash cargo-deny prints) once you've run `cargo deny check` once.

[bans]
# A single wildcard or git-pinned dep is a supply-chain smell. Multiple versions
# of the same crate is common in a big tree (libp2p), so only warn there.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true       # path deps inside the workspace are fine
highlight = "all"

[sources]
# Only crates.io and the explicitly-allowed git remotes are trusted.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
