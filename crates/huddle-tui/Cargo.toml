[package]
name = "huddle-tui"
version = "0.1.0"
edition = "2021"

[dependencies]
huddle-core = { path = "../huddle-core" }
libp2p = { version = "0.56", features = ["ed25519"] }
ratatui = "0.30"
crossterm = "0.29"
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
