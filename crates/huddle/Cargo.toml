[package]
name = "huddle"
version = "0.1.0"
edition = "2021"
description = "Decentralized, terminal-native chat rooms — LAN mDNS or direct dial, Megolm-encrypted."
license = "MIT OR Apache-2.0"
repository = "https://github.com/richer-richard/huddle"
homepage = "https://github.com/richer-richard/huddle"
readme = "README.md"
keywords = ["chat", "tui", "p2p", "libp2p", "encryption"]
categories = ["command-line-utilities", "network-programming"]

[[bin]]
name = "huddle"
path = "src/main.rs"

[dependencies]
huddle-core = { path = "../huddle-core", version = "0.1.0" }
libp2p = { version = "0.56", features = ["ed25519"] }
ratatui = "0.30"
crossterm = "0.29"
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
dirs = "6"
