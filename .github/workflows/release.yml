name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build artifacts for (e.g. v2.0.0)'
        required: true

# huddle 2.0.3 (audit N-M8): default the workflow token to read-only. Only the
# two jobs that upload release assets opt into `contents: write` per-job below;
# the publish job needs no repo write at all. This keeps the repo-write token out
# of the env of jobs that compile the untrusted dependency tree.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# huddle 2.1.2 (audit SCB-1): every third-party action is pinned to a full commit
# SHA (comment = the tag/branch it resolved to) so a silently repointed tag can't
# run arbitrary code in jobs that hold the crates.io token or a contents:write
# token. dtolnay/rust-toolchain is pinned to its `master` action commit with the
# channel passed via the `toolchain:` input.
jobs:
  # Build the three binaries per OS and attach them to the GitHub release.
  binaries:
    name: binaries ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
      # huddle 2.1.2 (audit SCB-2): required to mint signed build-provenance
      # attestations for the uploaded archives.
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: zip
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          # huddle 2.0.3 (audit N-M8): don't leave the GITHUB_TOKEN in .git/config
          # where an untrusted dependency build script in this job could read it.
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Linux build/GUI system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config perl \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev
      - name: Install nasm (Windows vendored OpenSSL)
        if: runner.os == 'Windows'
        run: choco install nasm --no-progress -y
      - name: Build release binaries
        run: cargo build --release --workspace --bins --locked
      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        # huddle 2.1.2 (audit SCB-3): pass the (attacker-influenceable) tag through
        # an env var rather than interpolating ${{ }} straight into the script — the
        # N-L11 pattern already used in fuzz.yml — so a crafted tag name can't inject
        # shell commands. (matrix.target is a workflow-controlled constant.)
        env:
          REF_NAME: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          VER="$REF_NAME"
          NAME="huddle-${VER}-${{ matrix.target }}"
          mkdir -p "dist/$NAME"
          cp target/release/huddle target/release/huddle-gui target/release/huddle-server "dist/$NAME/"
          cp README.md SECURITY.md LICENSE* "dist/$NAME/" 2>/dev/null || true
          tar -C dist -czf "dist/$NAME.tar.gz" "$NAME"
          (cd dist && shasum -a 256 "$NAME.tar.gz" > "$NAME.tar.gz.sha256")
      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        # huddle 2.1.2 (audit SCB-3): tag via env var, not inline ${{ }} (the bash
        # job uses $REF_NAME; pwsh prefers $env:GITHUB_REF_NAME for tag pushes and
        # falls back to the env-routed dispatch input).
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          $VER = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { $env:INPUT_TAG }
          $NAME = "huddle-$VER-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path "dist/$NAME" | Out-Null
          Copy-Item target/release/huddle.exe,target/release/huddle-gui.exe,target/release/huddle-server.exe "dist/$NAME/"
          Compress-Archive -Path "dist/$NAME" -DestinationPath "dist/$NAME.zip"
          (Get-FileHash "dist/$NAME.zip" -Algorithm SHA256).Hash | Out-File "dist/$NAME.zip.sha256"
      # huddle 2.1.2 (audit SCB-2): mint signed build provenance for the archive so
      # a downstream user can cryptographically verify it was built by THIS workflow
      # from this repo — `gh attestation verify <file> --repo <owner>/huddle` — which
      # the co-located .sha256 (same trust domain as the artifact) cannot provide.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: dist/*.${{ matrix.ext }}
      - name: Attach to release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          fail_on_unmatched_files: false

  sbom:
    name: SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - name: Generate CycloneDX SBOM
        # huddle 2.1.2 (audit SCB-4): pin the tool version (not just --locked).
        run: |
          cargo install cargo-cyclonedx --version 0.5.9 --locked
          cargo cyclonedx --format json --all
      - name: Collect SBOMs
        run: |
          mkdir -p sbom && find . -name '*.cdx.json' -exec cp {} sbom/ \; || true
      - name: Attach SBOM to release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: sbom/*.json
          fail_on_unmatched_files: false

  # Opt-in: publishes only if a CARGO_REGISTRY_TOKEN secret is configured, so it
  # can never accidentally double-publish a manually-released version.
  publish:
    name: cargo publish (opt-in)
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Publish workspace to crates.io
        env:
          TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "CARGO_REGISTRY_TOKEN not set — skipping publish (release was likely published manually)."
            exit 0
          fi
          # huddle 2.0.3 (audit N-C1): --no-verify so `cargo publish` does NOT run
          # a verify-build of the whole dependency tree with the registry token in
          # the process env — that build would execute every transitive build
          # script / proc-macro and let any one of them exfiltrate the token. The
          # binaries job above already compiles the full workspace, and CI tested
          # this commit, so the build is verified elsewhere. (Full fix: migrate to
          # crates.io Trusted Publishing / OIDC so no long-lived token exists.)
          cargo publish --workspace --no-verify --token "$TOKEN"
