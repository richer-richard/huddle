name: Fuzz smoke

# A short fuzz smoke over the F12 cargo-fuzz targets (invite/RoomMessage/file_id
# parsers). Weekly + on demand — not on every push (fuzzing is slow). A long
# corpus-building campaign is out of scope here; this catches regressions that
# make a parser trivially crash on malformed input.
on:
  schedule:
    - cron: '0 6 * * 1'   # Mondays 06:00 UTC
  workflow_dispatch:
    inputs:
      seconds:
        description: 'Seconds per target'
        default: '120'

permissions:
  contents: read

jobs:
  fuzz:
    name: cargo-fuzz smoke
    runs-on: ubuntu-latest
    steps:
      # huddle 2.1.2 (audit SCB-1): third-party actions pinned to commit SHAs;
      # dtolnay/rust-toolchain pinned to its master commit with the channel passed
      # via the `toolchain:` input.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@a45951ff880207c249adf57334cf2e9bd81d6e1e # v2
      - name: Build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config perl
      # huddle 2.1.2 (audit SCB-4): pin the tool version (not just --locked).
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Run each target briefly
        working-directory: crates/huddle-core
        # huddle 2.0.3 (audit N-L11): pass the workflow input through an env var
        # rather than interpolating ${{ }} directly into the shell (injection-safe).
        env:
          SECONDS_INPUT: ${{ github.event.inputs.seconds || '120' }}
        run: |
          SECS="$SECONDS_INPUT"
          # The fuzz crate is a detached workspace under crates/huddle-core/fuzz.
          targets=$(cargo fuzz list)
          echo "Fuzz targets: $targets"
          for t in $targets; do
            echo "::group::fuzzing $t for ${SECS}s"
            cargo fuzz run "$t" -- -max_total_time="$SECS" -rss_limit_mb=4096
            echo "::endgroup::"
          done
